name: Обновить сайт

on:
  schedule:
    - cron: '0 5,17 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # убирает предупреждение

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установить зависимости
        run: pip install requests

      - name: Собрать сайт
        run: python build.py
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}

      - name: Отправить изменения
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Обновление: $(date '+%d.%m.%Y %H:%M')"
          git push
